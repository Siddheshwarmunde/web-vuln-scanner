<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan Results</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      }
      h2 {
        font-size: 28px;
        color: #333;
        text-align: center;
        margin-bottom: 30px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .vulnerable {
        background-color: #f8d7da;
        color: #721c24;
      }
      .non-vulnerable {
        background-color: #d4edda;
        color: #155724;
      }
      .error {
        background-color: #fff3cd;
        color: #856404;
      }
      /* Style for the button */
      .back-btn {
        display: inline-block;
        padding: 10px 20px;
        margin-top: 20px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        border-radius: 5px;
        text-decoration: none;
        font-size: 16px;
      }

      .back-btn:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Scan Results</h2>
      <table>
        <thead>
          <tr>
            <th>Payload</th>
            <th>Response</th>
            <th>Time Taken (s)</th>
            <th>Severity</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {% for result in results %}
          <tr
            class="{{ 'vulnerable' if result['worked'] else 'non-vulnerable' }} "
          >
            <td>{{ result['payload'] }}</td>
            <td>{{ result['response'] }}</td>
            <td>{{ result['time_taken'] }}</td>
            <td>{{ result['severity'] }}</td>
            <td>
              {{ 'Vulnerable' if result['worked'] else 'Not Vulnerable' }}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <!-- Add Go to Home button -->
      <a href="/" class="back-btn">Go to Home Page</a>
    </div>
  </body>
</html>
